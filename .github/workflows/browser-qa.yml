name: Browser QA
on:
  pull_request:
    branches: [refactor/v2-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run qa:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aerion-synthetic-browser-qa
          path: artifacts/v3-qa/
          retention-days: 14
